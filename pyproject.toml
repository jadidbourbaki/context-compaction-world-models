[project]
name = "shared-cache-world-model"
version = "0.1.0"
description = "Where a game world model keeps its history"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy==2.5.3",
  "torch==2.14.0",
  "pydantic==2.13.5",
  "tyro==1.0.16",
  "imageio==2.37.4",
  "matplotlib==3.11.1",
  "networkx==3.6.1",
  "gradio==6.28.0",
  "huggingface-hub==1.32.0",
]

[dependency-groups]
dev = [
    "hypothesis==6.168.0",
    "pytest==9.1.1",
    "ruff==0.16.6",
    "ty==0.0.80",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shared_cache_world_model"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
